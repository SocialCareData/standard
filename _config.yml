# Jekyll Configuration
title: Social Care Interoperability Standards
url: https://standard.socialcaredata.io
description: Knowledge base and social care interoperability standards development
lang: en
locale: en_GB
theme_color: "#0f4b69"
newsletter: https://github.us15.list-manage.com/subscribe?u=cc2fe06b8de4efcacfb9a9e18&id=410af499ef
github_username: socialcaredata
repository: socialcaredata/standard
source: src
destination: dist
defaults:
  -
    scope:
      path: ""
      type: pages
    values:
      layout: default
  -
    scope:
      path: ""
      type: posts
    values:
      layout: post
homepage:
  title: Social Care Data
  url: /
nav:
  - title: Learn
    description: Learn about the standards
    url: /learn_about_the_standards
    children:
      - title: Learn about the standards
        url: /learn_about_the_standards
        description: What the standards are and why they matter.
      - title: Our use cases
        url: /use_cases
        description: The real situations the standards have to serve.
      - title: How our use cases relate to our standards
        url: /use_case_standard_matrix
        description: Trace each use case through to the standards it drives.
  - title: Publications
    description: Publications
    url: /publications
    children: []
  - title: Contribute
    description: Contribute to the standards
    url: /contribute_to_the_standards
    children:
      - title: Our standards working groups
        url: /standards_working_groups
        description: Open groups shaping each standard.
      - title: Calendar
        url: /calendar
        description: Upcoming meetings across the programme.
  - title: About
    description: About the programme
    url: /about
    children:
      - title: Programme structure and team
        url: /programme_structure
        description: Who does what, and how the workstreams fit together.
      - title: Related programmes
        url: /related_programmes
        description: Adjacent standards work in health, justice and local government.
  - title: Updates
    description: Updates
    url: /updates
    children: []
pagefind: true
check_internal_links: true
check_external_links: true
check_insecure_links: true
footer:
  copyright:
    title: Crown Copyright
    url: https://www.nationalarchives.gov.uk/information-management/re-using-public-sector-information/copyright-and-re-use/crown-copyright/
  license:
    title: Open Government License v3
    url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
styles:
  input: /_styles/
  output: /assets/css/styles.css
  rouge_theme: github
  minify: true
excerpt_separator: <!--more-->
include:
  - _pages
exclude:
  - docker-compose.yml
  - LICENSE
  - README.md
markdown: kramdown
kramdown:
  parse_block_html: true
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
plugins:
  - jekyll-feed
  - jekyll-sitemap
