name: Sync ontology

# Regenerates the OWL and SHACL artifacts from the LinkML schemas and opens a
# pull request on SocialCareData/ontology with whatever changed.

on:
  push:
    branches: [main]
    paths:
      - 'src/_data/model/**'
      - 'src/assets/scripts/build_ontology.py'
      - 'src/assets/scripts/requirements.txt'
      - '.github/workflows/ontology-sync.yml'
  workflow_dispatch:

concurrency:
  group: ontology-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          # LinkML needs >= 3.11 with the _lzma stdlib module.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/assets/scripts/requirements.txt

      - name: Install LinkML
        run: pip install -r src/assets/scripts/requirements.txt

      - name: Generate ontology and shapes
        timeout-minutes: 15
        run: |
          python src/assets/scripts/build_ontology.py \
            --out "$RUNNER_TEMP/ontology" \
            --validation-out "$RUNNER_TEMP/validation"

      - uses: actions/setup-node@v7

      - name: Install validator dependencies
        run: npm ci
        working-directory: src/assets/shacl/validation

      # Gate: the standards' own examples must behave as expected against the
      # freshly generated shapes before anything is published.
      - name: Validate examples against the generated shapes
        env:
          MODEL_ROOT: ${{ runner.temp }}/validation
        run: node validate.js
        working-directory: src/assets/shacl/validation

      - name: Read release version
        id: manifest
        run: |
          version=$(python -c "import yaml;print(yaml.safe_load(open('src/_data/model/mais/manifest.yml'))['mais_version'])")
          echo "mais_version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: SocialCareData/ontology
          # Fine-grained PAT scoped to SocialCareData/ontology with
          # Contents: write and Pull requests: write.
          token: ${{ secrets.ONTOLOGY_SYNC_TOKEN }}
          path: ontology

      - name: Copy generated artifacts
        run: |
          # --delete so a schema removed upstream also disappears downstream;
          # without it the two repositories silently diverge. The ontology
          # repo's own hand-written root files are anchored out with a leading
          # slash so they are never touched.
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '/README.md' \
            --exclude '/LICENSE' \
            "$RUNNER_TEMP/ontology/" ontology/

      - name: Open pull request
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.ONTOLOGY_SYNC_TOKEN }}
          path: ontology
          branch: automation/sync-from-standard
          delete-branch: true
          commit-message: |
            Sync ontology from standard@${{ github.sha }}

            Generated by SocialCareData/standard.
          title: 'Sync ontology from standard (MAIS ${{ steps.manifest.outputs.mais_version }})'
          body: |
            Regenerated from the LinkML schemas in
            [SocialCareData/standard](https://github.com/SocialCareData/standard)
            at [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

            - MAIS release: `${{ steps.manifest.outputs.mais_version }}`
            - Triggered by: `${{ github.event_name }}`

            The standards' JSON-LD examples were validated against these shapes
            before this pull request was opened.

            > Generated files — review the diff, but make corrections in the
            > LinkML YAML upstream rather than here.

      - name: Report outcome
        run: |
          if [ -z "${{ steps.pr.outputs.pull-request-number }}" ]; then
            echo "No changes - the ontology repo is already up to date."
          else
            echo "PR #${{ steps.pr.outputs.pull-request-number }} (${{ steps.pr.outputs.pull-request-operation }}): ${{ steps.pr.outputs.pull-request-url }}"
          fi
