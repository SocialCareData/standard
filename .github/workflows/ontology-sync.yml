name: Sync ontology

# Regenerates the OWL and SHACL artifacts from the LinkML schemas and opens a
# pull request on SocialCareData/ontology with whatever changed.

on:
  push:
    branches: [main]
    paths:
      - 'src/_data/model/**'
      - 'src/assets/scripts/build_ontology.py'
      - 'src/assets/scripts/requirements.txt'
      - '.github/workflows/ontology-sync.yml'
  workflow_dispatch:

concurrency:
  group: ontology-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      BRANCH: automation/sync-from-standard
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          # LinkML needs >= 3.11 with the _lzma stdlib module.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/assets/scripts/requirements.txt

      - name: Install LinkML
        run: pip install -r src/assets/scripts/requirements.txt

      - name: Generate ontology and shapes
        timeout-minutes: 15
        run: python src/assets/scripts/build_ontology.py --out "$RUNNER_TEMP/ontology"

      - name: Read release version
        id: manifest
        run: |
          version=$(python -c "import yaml;print(yaml.safe_load(open('src/_data/model/social-care/manifest.yml'))['ontlogy_version'])")
          echo "ontlogy_version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: SocialCareData/ontology
          # Fine-grained PAT scoped to SocialCareData/ontology with
          # Contents: write and Pull requests: write.
          token: ${{ secrets.ONTOLOGY_SYNC_TOKEN }}
          path: ontology

      - name: Copy generated artifacts
        run: |
          # --delete so a schema removed upstream also disappears downstream;
          # without it the two repositories silently diverge. The ontology
          # repo's own hand-written root files are anchored out with a leading
          # slash so they are never touched, as are its hand-written examples
          # and workflows.
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '/.github/' \
            --exclude '/README.md' \
            --exclude '/LICENSE' \
            --exclude '/examples/' \
            "$RUNNER_TEMP/ontology/" ontology/

      - name: Commit changes
        id: commit
        working-directory: ontology
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes - the ontology repo is already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Sync ontology from standard@$GITHUB_SHA" -m "Generated by SocialCareData/standard."
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push branch
        if: steps.commit.outputs.changed == 'true'
        working-directory: ontology
        run: git push --force origin "$BRANCH"

      - name: Open or update pull request
        if: steps.commit.outputs.changed == 'true'
        working-directory: ontology
        env:
          GH_TOKEN: ${{ secrets.ONTOLOGY_SYNC_TOKEN }}
          PR_BODY: |
            Regenerated from the LinkML schemas in
            [SocialCareData/standard](https://github.com/SocialCareData/standard)
            at [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

            - Ontology release: `${{ steps.manifest.outputs.ontlogy_version }}`

            > Generated files — review the diff, but make corrections in the
            > LinkML YAML upstream rather than here.
        run: |
          url=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url')
          if [ -n "$url" ]; then
            echo "Updated existing PR: $url"
          else
            gh pr create --head "$BRANCH" --title 'Sync ontology from standard' --body "$PR_BODY"
          fi
