config:
  standards:
    - name: Person - subject of care
      description: A person receiving care, with the fuller identity and demographic detail that role requires.
      shapes: https://github.com/SocialCareData/ontology/blob/main/person/person-subject-of-care-shape.ttl
      context: https://github.com/SocialCareData/ontology/blob/main/person/context.jsonld
      examples:
        - https://github.com/SocialCareData/ontology/blob/main/examples/person/subject-of-care/valid-subject-of-care.jsonld
        - https://github.com/SocialCareData/ontology/blob/main/examples/person/subject-of-care/valid-subject-of-care-full.jsonld
        - https://github.com/SocialCareData/ontology/blob/main/examples/person/subject-of-care/invalid-subject-of-care.jsonld

    - name: Person - connected person
      description: Someone connected to a subject of care - a relative, carer or contact - held to a lighter standard.
      shapes: https://github.com/SocialCareData/ontology/blob/main/person/person-connected-shape.ttl
      context: https://github.com/SocialCareData/ontology/blob/main/person/context.jsonld
      examples:
        - https://github.com/SocialCareData/ontology/blob/main/examples/person/connected/valid-connected.jsonld
        - https://github.com/SocialCareData/ontology/blob/main/examples/person/connected/valid-connected-full.jsonld
        - https://github.com/SocialCareData/ontology/blob/main/examples/person/connected/invalid-connected.jsonld

    - name: Children's Social Care Placements
      description: A placement record across its whole lifecycle, from requirements through to quality assurance.
      shapes: https://github.com/SocialCareData/ontology/blob/main/placements/placements-standard-shape.ttl
      context: https://github.com/SocialCareData/ontology/blob/main/placements/context.jsonld
      csvMetadata: https://github.com/SocialCareData/ontology/blob/main/placements/csv-metadata.json
      examples:
        - https://github.com/SocialCareData/ontology/blob/main/examples/placements/valid-placement.jsonld
        - https://github.com/SocialCareData/ontology/blob/main/examples/placements/valid-placement-full.jsonld
        - https://github.com/SocialCareData/ontology/blob/main/examples/placements/valid-placement.csv
        - https://github.com/SocialCareData/ontology/blob/main/examples/placements/valid-placements-several-rows.csv
        - https://github.com/SocialCareData/ontology/blob/main/examples/placements/invalid-placement.jsonld
        - https://github.com/SocialCareData/ontology/blob/main/examples/placements/invalid-placement.csv

    - name: Safeguarding
      description: Organisations, services, professionals and service episodes involved in safeguarding.
      shapes: https://github.com/SocialCareData/ontology/blob/main/safeguarding/safeguarding-standard-shape.ttl
      context: https://github.com/SocialCareData/ontology/blob/main/safeguarding/context.jsonld
      examples:
        - https://github.com/SocialCareData/ontology/blob/main/examples/safeguarding/valid-safeguarding.jsonld
        - https://github.com/SocialCareData/ontology/blob/main/examples/safeguarding/valid-safeguarding-full.jsonld
        - https://github.com/SocialCareData/ontology/blob/main/examples/safeguarding/invalid-safeguarding.jsonld

    - name: Care Needs Assessments and Care Plans
      description: Care needs assessments and the care plans that follow from them.
      shapes: https://github.com/SocialCareData/ontology/blob/main/assessments-and-plans/assessments-and-plans-standard-shape.ttl
      context: https://github.com/SocialCareData/ontology/blob/main/assessments-and-plans/context.jsonld
      examples:
        - https://github.com/SocialCareData/ontology/blob/main/examples/assessments-and-plans/valid-assessments-and-plans.jsonld
        - https://github.com/SocialCareData/ontology/blob/main/examples/assessments-and-plans/valid-assessments-and-plans-full.jsonld
        - https://github.com/SocialCareData/ontology/blob/main/examples/assessments-and-plans/invalid-assessments-and-plans.jsonld

    - name: Referrals and Requests
      description: Referrals, requests, and quality-of-care concerns.
      shapes: https://github.com/SocialCareData/ontology/blob/main/referrals/referrals-standard-shape.ttl
      context: https://github.com/SocialCareData/ontology/blob/main/referrals/context.jsonld
      examples:
        - https://github.com/SocialCareData/ontology/blob/main/examples/referrals/valid-referral.jsonld
        - https://github.com/SocialCareData/ontology/blob/main/examples/referrals/valid-referral-unnamed-subject.jsonld
        - https://github.com/SocialCareData/ontology/blob/main/examples/referrals/valid-request.jsonld
        - https://github.com/SocialCareData/ontology/blob/main/examples/referrals/valid-qoc-concern.jsonld
        - https://github.com/SocialCareData/ontology/blob/main/examples/referrals/invalid-referral.jsonld

  placeholder: |-
    {
      "@type": "Person",
      "name": [{ "@type": "Name", "givenName": ["Ada"], "familyName": "Lovelace" }]
    }

  versions: tags
  readOnly: true
