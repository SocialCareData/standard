  ReferrerTypeCode:
    enum_uri: ref:referrer-type
    title: Referrer Types
    description: Nature of the referrer's relationship to the subject or process.
    permissible_values:
      Self:
        title: Self
        meaning: rft:Self
      FamilyMember:
        title: Family member
        meaning: rft:FamilyMember
      Professional:
        title: Professional
        meaning: rft:Professional
      MemberOfThePublic:
        title: Member of the public
        meaning: rft:MemberOfThePublic

  ResponseStatusCode:
    enum_uri: ref:response-status
    title: Response Statuses
    description: >-
      What a response to a referral, request or quality-of-care concern says.
      Each status is what the responder said at one point in time; a later
      response may give a different status.
    permissible_values:
      acknowledged:
        title: Acknowledged
        meaning: rs:Acknowledged
        description: Received, but no decision has been made yet.
      information-requested:
        title: Information requested
        meaning: rs:InformationRequested
        description: >-
          The responder needs more information before it can make a decision.
      accepted:
        title: Accepted
        meaning: rs:Accepted
        description: The responder will act on the referral, request or concern.
      accepted.waitlisted:
        title: Accepted, waitlisted
        meaning: rs:AcceptedWaitlisted
        description: Accepted, but there will be a wait before the responder acts.
      delayed:
        title: Delayed
        meaning: rs:Delayed
        description: >-
          A decision, or the start of a service, will be later than expected.
      redirected:
        title: Redirected
        meaning: rs:Redirected
        description: >-
          Passed on to another team or service. Where the new referral or
          request is known, link it with linkedRecord.
      declined:
        title: Declined
        meaning: rs:Declined
        description: The responder will not act on the referral, request or concern.
      declined.ineligible:
        title: Declined, ineligible
        meaning: rs:DeclinedIneligible
        description: >-
          Declined because the person or the need does not meet the
          responder's eligibility criteria or threshold.
      closed:
        title: Closed
        meaning: rs:Closed
        description: >-
          No further action, after the referral, request or concern was
          accepted or assessed.
