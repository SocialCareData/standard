id: https://ns.socialcaredata.io/referrals
name: referrals
title: Referrals and Requests Standard Data Model
description: >-
  A LinkML data model for the Referrals and Requests Standard (PUB06): establishing a common,
  extensible referral and request data standard that acts as a reusable transfer-of-care message
  pattern across Children's and Adult Social Care.
license: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  ref: https://ns.socialcaredata.io/
  rt: https://ns.socialcaredata.io/referral-type#
  con: https://ns.socialcaredata.io/concern#
  qcon: https://ns.socialcaredata.io/qoc-concern#
  rp: https://ns.socialcaredata.io/request-purpose#
  rqc: https://ns.socialcaredata.io/referral-question-category#
  rr: https://ns.socialcaredata.io/record-relationship#
  rft: https://ns.socialcaredata.io/referrer-type#
  rs: https://ns.socialcaredata.io/response-status#
  skos: http://www.w3.org/2004/02/skos/core#
  dct: http://purl.org/dc/terms/
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: ref
default_range: string
imports:
  - linkml:types
  - https://ns.socialcaredata.io/common
  - https://ns.socialcaredata.io/person
  - https://ns.socialcaredata.io/safeguarding

# ---------------------------------------------------------------------------
# Classes
# ---------------------------------------------------------------------------
classes:

  Referral:
    class_uri: ref:Referral
    description: >-
      Inward, person-centric, point-of-entry referral into social services.
      A referral is not the way to report an emergency: where someone is in
      immediate danger, the emergency services should be called on 999 first.
    slots:
      - refIdentifier
      - referralType
      - refSubject
      - personalNetwork
      - refReferrer
      - concern
      - refInvolvement
      - refRecipient
      - refAssessmentQuestion
      - attachment
      - linkedRecord
      - refDateCompleted

  Request:
    class_uri: ref:Request
    description: >-
      Outward request for services for a person already known to social care.
      A request can be the outcome of a Multi-Agency Safeguarding Hub (MASH)
      decision in children's services or a front-door decision in adult social care.
      However, it is most commonly any request made from social services to
      statutory and non-statutory services, for both children and adults.
    slots:
      - refIdentifier
      - requestSubject
      - requestReferrer
      - requestRecipient
      - purpose
      - refAssessmentQuestion
      - attachment
      - linkedRecord
      - refDateCompleted

  QualityOfCareConcern:
    class_uri: ref:QualityOfCareConcern
    description: >-
      Quality-of-care concern raised about a care provider or service.
    slots:
      - refIdentifier
      - qocSubject
      - qocReferrer
      - qocRecipient
      - qocService
      - qocConcern
      - refAssessmentQuestion
      - attachment
      - linkedRecord
      - refDateCompleted

  Response:
    class_uri: ref:Response
    description: >-
      A record, held in a case management system, that describes a response to a
      referral, request or quality-of-care concern that has been sent or received. It
      confirms receipt and gives basic information about its contents. It is not
      necessarily a message between the parties, it does not capture the full
      response, and counterparty services that receive referrals, requests and concerns
      are not obliged to send one. Each response is a separate record of what
      happened at a point in time, so a referral that is acknowledged and later
      accepted has two responses.
    slots:
      - refIdentifier
      - respondsTo
      - respondsToType
      - responder
      - responseDateTimeReceived
      - responseStatus
      - responseDescription
      - attachment
      - linkedRecord

  IntakePerson:
    is_a: Person
    class_uri: ref:IntakePerson
    description: >-
      A person as first recorded when their details enter social care, for example
      as the subject of a referral. Every Person field is optional, because the
      referrer may know only some details (only an address, or
      only a name), and a free-text note can capture an overall account where
      very little else is known.

      Guidance for implementers:
      * A record should carry at least one detail, but this is not enforced by the model.
      * Record how the person can be contacted with the Person contact and address fields. Anything else about contacting them (when or how it is safe to, or what to avoid) belongs in notes.
      * Where the person is not aware of the referral, record why in notes.
      * Referrals submitted by professionals (like social workers, teachers, and doctors) should generally be held to a higher standard, requiring more data than a referral from, say, a member of the public.
    slots:
      - isAwareOfReferral
      - intakeNotes
    slot_usage:
      identifier:    {required: false, multivalued: true}
      name:          {required: false, multivalued: true}
      dateOfBirth:   {required: false, multivalued: false}
      isDeceased:    {required: false, multivalued: false}
      deceasedDate:  {required: false, multivalued: false}
      address:       {required: false, multivalued: true}
      genderCode:    {required: false, multivalued: false}
      ethnicityCode: {required: false, multivalued: false}

  PersonalNetworkMember:
    class_uri: ref:PersonalNetworkMember
    description: >-
      Person in the subject's family, household, or broader personal support network (non-professionals only).
    slots:
      - networkPerson
      - networkRelationship
      - networkDescription

  ReferrerDetails:
    class_uri: ref:ReferrerDetails
    description: >-
      Details of the referrer initiating the referral or concern.
    slots:
      - referrerPerson
      - referrerProfessional
      - referrerProfessionalId
      - referrerType
      - referrerRelationshipCode
      - relationshipDescription

  ConcernDetail:
    class_uri: ref:ConcernDetail
    description: >-
      A concern raised in a referral: a keyword type and the referrer's description of
      it. The type may be left UNASSIGNED in the initial referral (by referrer's choice,
      or by not presenting them an option in the user-facing form) and assigned at triage.
    slots:
      - concernType
      - concernDescription

  QocService:
    class_uri: ref:QocService
    description: >-
      The care provider or service a quality-of-care concern is about, as far
      as the person raising the concern can describe it. Every property is
      optional, because they may not know the service's name or identifier, and
      the service may not be recorded in the local authority's system. Triage
      can complete the details and update the record later.

      Guidance for implementers:
      * A record should carry at least one detail (most likely, the description), but this is not enforced by the model.
    slots:
      - qocServiceIdentifier
      - qocServiceName
      - qocServiceDescription

  QocConcernDetail:
    class_uri: ref:QocConcernDetail
    description: >-
      A concern raised about a care provider or service: a keyword type and a
      description of it. The type may be left UNASSIGNED when the concern is
      raised (by the choice of the person raising it, or by not presenting them
      an option in the user-facing form) and assigned at triage.
    slots:
      - qocConcernType
      - qocConcernDescription

  ReferralInvolvement:
    class_uri: ref:ReferralInvolvement
    description: >-
      Actions taken so far and parties involved.
    slots:
      - involvementActorType
      - involvementActorId
      - involvementDescription

  DocumentReference:
    class_uri: ref:DocumentReference
    description: >-
      Reference to an attached document or evidence supporting the referral or request.
    slots:
      - documentId
      - documentTitle
      - documentUrl
      - documentMimeType
      - documentDescription

  ReferralAssessmentQuestion:
    class_uri: ref:ReferralAssessmentQuestion
    is_a: AssessmentQuestion
    description: >-
      A generic Question-and-Answer model used to represent atypical, locally configured questions.
    slot_usage:
      category:
        range: ReferralQuestionCategory
        required: true
        multivalued: false
        description: "The domain of the question."

# ---------------------------------------------------------------------------
# Slots
# ---------------------------------------------------------------------------
slots:

  # --- Identifiers and Dates ---
  refIdentifier:
    slot_uri: ref:identifier
    title: identifier
    range: Identifier
    required: false
    multivalued: false
    description: Identifier for this referral, request, concern, or response.

  refDateCompleted:
    slot_uri: ref:dateCompleted
    title: dateCompleted
    range: datetime
    required: false
    multivalued: false
    description: Date completed.

  # --- Referral slots ---
  referralType:
    slot_uri: ref:type
    title: type
    range: ReferralTypeCode
    required: true
    multivalued: false
    description: Type of referral.

  refSubject:
    slot_uri: ref:subject
    title: subject
    range: IntakePerson
    required: true
    multivalued: true
    description: Who is the person?

  personalNetwork:
    slot_uri: ref:personalNetwork
    title: personalNetwork
    range: PersonalNetworkMember
    required: false
    multivalued: true
    description: Who is in the person's family, household, or personal network?

  refReferrer:
    slot_uri: ref:referrer
    title: referrer
    range: ReferrerDetails
    required: true
    multivalued: false
    description: Who is the referrer?

  concern:
    slot_uri: ref:concern
    title: concern
    range: ConcernDetail
    required: true
    multivalued: true
    description: >-
      What is the concern? Initially, this may be left UNASSIGNED, to be
      assigned at triage by professionals.

  refInvolvement:
    slot_uri: ref:referralInvolvement
    title: involvement
    range: ReferralInvolvement
    required: false
    multivalued: false
    description: What have you or others done so far?

  refRecipient:
    slot_uri: ref:recipient
    title: recipient
    range: Identifier
    required: true
    multivalued: true
    description: Who was this referral sent to?

  # --- Request slots ---
  requestSubject:
    slot_uri: ref:requestSubject
    title: subject
    range: Identifier
    required: true
    multivalued: false
    description: Who is the person? (Person identifier).

  requestReferrer:
    slot_uri: ref:requestReferrer
    title: referrer
    range: Identifier
    required: true
    multivalued: false
    description: Who is the referrer? (Identifier object).

  requestRecipient:
    slot_uri: ref:requestRecipient
    title: recipient
    range: Identifier
    required: true
    multivalued: true
    description: What service is requested? (Organisation / Service identifier).

  purpose:
    slot_uri: ref:purpose
    title: purpose
    range: RequestPurposeCode
    required: true
    multivalued: false
    description: >-
      What kind of request is this? The function this request serves.

  # --- Quality of Care Concern slots ---
  qocSubject:
    slot_uri: ref:qocSubject
    title: subject
    range: IntakePerson
    required: false
    multivalued: true
    description: Who is the person? (Optional for anonymisation).

  qocReferrer:
    slot_uri: ref:qocReferrer
    title: referrer
    range: ReferrerDetails
    required: false
    multivalued: false
    description: Who is the referrer? (Optional for anonymisation).

  qocRecipient:
    slot_uri: ref:qocRecipient
    title: recipient
    range: Identifier
    required: true
    multivalued: true
    description: >-
      Who was this concern sent to? Generally the local authority and
      the Care Quality Commission.

  qocService:
    slot_uri: ref:qocService
    title: service
    range: QocService
    required: true
    multivalued: false
    description: Which care provider or service is the concern about?

  qocServiceIdentifier:
    slot_uri: ref:identifier
    title: identifier
    range: Identifier
    required: false
    multivalued: false
    description: >-
      Identifier for the service, if known, such as its Care Quality
      Commission location ID or its identifier in the local authority's system.

  qocServiceName:
    slot_uri: ref:qocServiceName
    title: name
    range: string
    required: false
    multivalued: false
    description: The name of the service, if known.

  qocServiceDescription:
    slot_uri: ref:qocServiceDescription
    title: description
    range: string
    required: false
    multivalued: false
    description: >-
      Free-text description of the service (not the concern), in the words of the person raising
      the concern. For example, "the carers that visit my dad in the mornings".

  qocConcern:
    slot_uri: ref:qocConcern
    title: concern
    range: QocConcernDetail
    required: true
    multivalued: true
    description: >-
      What is the concern? Initially, this may be left UNASSIGNED, to be
      assigned at triage by professionals.

  # --- Response slots ---
  respondsTo:
    slot_uri: ref:respondsTo
    title: respondsTo
    range: Identifier
    required: true
    multivalued: false
    description: The referral, request or quality-of-care concern being responded to.

  respondsToType:
    slot_uri: ref:respondsToType
    title: respondsToType
    range: RecordTypeCode
    required: false
    multivalued: false
    description: >-
      The type of record being responded to (referral, request or
      quality-of-care concern). Helps where the identifier alone is ambiguous.

  responder:
    slot_uri: ref:responder
    title: responder
    range: Identifier
    required: true
    multivalued: false
    description: >-
      The organisation, service or professional that responded. Shows the
      direction of the response, for example whether a local authority sent it
      or received it.

  responseDateTimeReceived:
    slot_uri: ref:dateTimeReceived
    title: dateTimeReceived
    range: datetime
    required: true
    multivalued: false
    description: >-
      When the response was received by the party it was sent to. For a
      response the record holder sent, where the time it was received is
      not known, use the time it was sent.

  responseStatus:
    slot_uri: ref:responseStatus
    title: status
    range: ResponseStatusCode
    required: true
    multivalued: false
    description: What was the response?

  responseDescription:
    slot_uri: ref:responseDescription
    title: description
    range: string
    required: false
    multivalued: false
    description: Free-text summary of what the responder said.

  # --- Generic / Shared slots ---
  refAssessmentQuestion:
    slot_uri: ref:referralAssessmentQuestion
    title: assessmentQuestion
    range: ReferralAssessmentQuestion
    required: false
    multivalued: true
    description: Atypical, locally configured questions.

  attachment:
    slot_uri: ref:attachment
    title: attachment
    range: DocumentReference
    required: false
    multivalued: true
    description: Attachments and reference to documents.

  # --- Supporting class slots ---
  isAwareOfReferral:
    slot_uri: ref:isAwareOfReferral
    title: isAwareOfReferral
    range: boolean
    required: true
    multivalued: false
    description: >-
      Does this person know that the referral or concern is being made? This
      is about awareness of the referral itself, not of the problem it
      describes, and is not the same as consent. If not, say why in notes.

  intakeNotes:
    slot_uri: ref:intakeNotes
    title: notes
    range: string
    required: false
    multivalued: false
    description: >-
      Free-text notes about the person to convey identifying information
      where little else is known (eg. where they have been seen in the local
      area). Also the location to record anything about how to contact the person
      safely, and why they are not aware of the referral, if they are not.

  networkPerson:
    slot_uri: ref:networkPerson
    title: person
    range: IntakePerson
    required: true
    multivalued: false
    description: Person in the personal network.

  networkRelationship:
    slot_uri: ref:networkRelationship
    title: relationship
    range: PersonRelationshipCode
    required: true
    multivalued: false
    description: Relationship to the subject.

  networkDescription:
    slot_uri: ref:networkDescription
    title: description
    range: string
    required: false
    multivalued: false
    description: Text description of the personal network relationship.

  referrerPerson:
    slot_uri: ref:referrerPerson
    title: person
    range: Person
    required: false
    multivalued: false
    description: The person referring, when a non-professional.

  referrerProfessional:
    slot_uri: ref:referrerProfessional
    title: professional
    range: Professional
    required: false
    multivalued: false
    description: Professional object for the referrer.

  referrerProfessionalId:
    slot_uri: ref:referrerProfessionalId
    title: professionalId
    range: Identifier
    required: false
    multivalued: false
    description: Lightweight identifier reference for a professional referrer.

  referrerType:
    slot_uri: ref:referrerType
    title: referrerType
    range: ReferrerTypeCode
    required: true
    multivalued: false
    description: The type of referrer.

  referrerRelationshipCode:
    slot_uri: ref:referrerRelationshipCode
    title: relationship
    range: PersonRelationshipCode
    required: false
    multivalued: false
    description: Relationship code of the referrer to the subject.

  relationshipDescription:
    slot_uri: ref:relationshipDescription
    title: relationshipDescription
    range: string
    required: false
    multivalued: false
    description: Relationship description of referrer.

  concernType:
    slot_uri: ref:concernType
    title: concernType
    range: ConcernCode
    required: true
    multivalued: false
    description: >-
      The type of concern, or UNASSIGNED if no type was given when the referral
      was made. An UNASSIGNED concern is assigned a type at triage.

  concernDescription:
    slot_uri: ref:concernDescription
    title: description
    range: string
    required: false
    multivalued: false
    description: >-
      Free-text description of the concern, in the referrer's own words. When the type
      is UNASSIGNED, triage by professionals relies on this description.

  qocConcernType:
    slot_uri: ref:qocConcernType
    title: concernType
    range: QocConcernCode
    required: true
    multivalued: false
    description: >-
      The type of concern, or UNASSIGNED if no type was given when the concern
      was raised. An UNASSIGNED concern is assigned a type at triage.

  qocConcernDescription:
    slot_uri: ref:qocConcernDescription
    title: description
    range: string
    required: false
    multivalued: false
    description: >-
      Free-text description of the concern, in the words of the person raising
      it. This is what triage relies on when the type is UNASSIGNED.

  involvementActorType:
    slot_uri: ref:involvementActorType
    title: actorType
    range: ReferrerTypeCode
    required: false
    multivalued: false
    description: Category of the actor involved (e.g. Self, Professional).

  involvementActorId:
    slot_uri: ref:involvementActorId
    title: actorId
    range: Identifier
    required: false
    multivalued: true
    description: Identifier(s) of the professional or actor involved.

  involvementDescription:
    slot_uri: ref:involvementDescription
    title: description
    range: string
    required: false
    multivalued: false
    description: Free text description of involvement.

  documentId:
    slot_uri: ref:documentId
    title: documentId
    range: Identifier
    required: false
    multivalued: false
    description: Unique identifier for the document.

  documentTitle:
    slot_uri: ref:documentTitle
    title: title
    range: string
    required: false
    multivalued: false
    description: Title or display name of the document.

  documentUrl:
    slot_uri: ref:documentUrl
    title: url
    range: uri
    required: false
    multivalued: false
    description: Web address or storage URI where the document can be retrieved.

  documentMimeType:
    slot_uri: ref:documentMimeType
    title: mimeType
    range: string
    required: false
    multivalued: false
    description: Media type / MIME type of the document.

  documentDescription:
    slot_uri: ref:documentDescription
    title: description
    range: string
    required: false
    multivalued: false
    description: Text description of the document.

# ---------------------------------------------------------------------------
# Controlled Vocabularies (Enums)
# ---------------------------------------------------------------------------
enums:

  ReferralTypeCode:
    enum_uri: ref:referral-type
    title: Referral Types
    description: Codes representing the type of inward referral.
    permissible_values:
      child.safeguarding:
        title: Safeguarding concern
        meaning: rt:ChildSafeguarding
        description: >-
          A concern that a child is being, or is at risk of being, abused,
          neglected or otherwise harmed, inside or outside the family. Depending
          on (MASH) triage, this may lead to enquiries under section 47 of the Children
          Act 1989, an assessment of the child's needs, or early help.
      child.infoRequest:
        title: Information request
        meaning: rt:ChildInfoRequest
        description: >-
          A request for information or advice about a child or family, or about
          the support available, that does not itself raise a concern. For
          example, a parent asking what help is available, or a professional
          asking for advice.
      child.crossService:
        title: Professional concern about a child from engagement with an adult
        meaning: rt:ChildCrossService
        description: >-
          A concern about a child raised by a professional working with an adult
          connected to them, such as the child's parent or someone in their
          household. For example, from adult mental health, drug and alcohol,
          probation or adult social care services.
      child.returningCareLeaver:
        title: Care leaver returning for support
        meaning: rt:ChildReturningCareLeaver
        description: >-
          A care leaver getting back in touch with the local authority to ask for
          support, such as a personal adviser, which former relevant children can
          request up to age 25 under the Children Act 1989 (as amended by the
          Children and Social Work Act 2017). Usually a self-referral. The care
          leaver is an adult, but leaving care support is provided by children's
          services.
      adult.general:
        title: Contact or request for support
        meaning: rt:AdultGeneral
        description: >-
          A person, or someone on their behalf, contacting adult social care
          about care and support needs, where the kind of help needed is not yet
          clear.
      adult.safeguarding:
        title: Safeguarding concern
        meaning: rt:AdultSafeguarding
        description: >-
          A concern that an adult with care and support needs is experiencing,
          or is at risk of, abuse or neglect, and cannot protect themselves
          because of those needs. Triage decides whether this meets the criteria
          for a safeguarding enquiry under section 42 of the Care Act 2014.
      adult.independentLiving:
        title: Request for occupational therapy or home equipment
        meaning: rt:AdultIndependentLiving
        description: >-
          A request for an occupational therapy assessment, equipment or minor
          adaptations to help a person stay safe and independent at home, such
          as grab rails or bathing equipment.
      adult.careActAssessment:
        title: Request for care needs assessment or review
        meaning: rt:AdultCareActAssessment
        description: >-
          A request for a needs assessment (section 9 of the Care Act 2014)
          or a review of an existing care and support plan (section 27).
      adult.infoRequest:
        title: Information request
        meaning: rt:AdultInfoRequest
        description: >-
          A request for information or advice about care and support, which
          local authorities must provide under section 4 of the Care Act 2014,
          that does not itself raise a concern or ask for an assessment.
      adult.crossService:
        title: Professional concern about an adult from engagement with a child
        meaning: rt:AdultCrossService
        description: >-
          A concern about an adult raised by a professional working with a child
          connected to them, such as the child's parent or carer. For example,
          from a school, health visitor, children's social care or child and
          adolescent mental health services.

  ConcernCode:
    enum_uri: ref:concern-code
    title: Concerns
    description: >-
      The nature of the concern raised in a referral. The child codes are the
      four categories of abuse and neglect that Working Together to Safeguard
      Children 2023 uses for the significant harm threshold in the Children Act
      1989, plus extra-familial harm. The adult codes are the types of abuse and
      neglect in the Care and Support Statutory Guidance under the Care Act
      2014. Each group has an Other code for concerns outside these categories.
      UNASSIGNED marks a concern that was not classified when the referral was
      made, either by the referrer's choice or because the form did not ask,
      to be assigned at triage.
    permissible_values:
      UNASSIGNED:
        title: Unassigned
        meaning: con:Unassigned
        description: >-
          Not yet classified. The concern has been described but no type was
          given when the referral was made, either by the referrer's choice or
          because the form did not ask; the type is assigned at triage, by
          professionals.
      child.physicalAbuse:
        title: Physical abuse
        meaning: con:ChildPhysicalAbuse
        description: >-
          Deliberately causing physical harm to a child, for example hitting,
          shaking, burning or poisoning, or fabricating or inducing illness.
      child.sexualAbuse:
        title: Sexual abuse
        meaning: con:ChildSexualAbuse
        description: >-
          Forcing or enticing a child to take part in sexual activities, whether
          or not the child is aware of what is happening, including online and
          non-contact abuse.
      child.emotionalAbuse:
        title: Emotional abuse
        meaning: con:ChildEmotionalAbuse
        description: >-
          Persistent emotional maltreatment that severely affects a child's
          emotional development, including seeing or hearing the ill-treatment
          of others, such as domestic abuse.
      child.neglect:
        title: Neglect
        meaning: con:ChildNeglect
        description: >-
          Persistent failure to meet a child's basic physical or psychological
          needs, likely to seriously impair their health or development.
      child.extrafamilialHarm:
        title: Extra-familial harm
        meaning: con:ChildExtrafamilialHarm
        description: >-
          Harm from outside the family, for example criminal or sexual
          exploitation, serious youth violence, county lines or radicalisation.
      child.other:
        title: Other
        meaning: con:ChildOther
        description: >-
          A concern about a child that does not fit the categories above.
          Describe it in the concern's description.
      adult.physicalAbuse:
        title: Physical abuse
        meaning: con:AdultPhysicalAbuse
        description: >-
          Includes assault, hitting, slapping, misuse of medication, restraint
          and inappropriate physical sanctions.
      adult.domesticAbuse:
        title: Domestic violence or abuse
        meaning: con:AdultDomesticAbuse
        description: >-
          Abuse within an intimate or family relationship, including coercive
          control and psychological, physical, sexual, financial and emotional
          abuse, and so-called honour-based violence.
      adult.sexualAbuse:
        title: Sexual abuse
        meaning: con:AdultSexualAbuse
        description: >-
          Includes rape, indecent exposure, sexual harassment, inappropriate
          touching, and sexual acts the adult has not consented to or could not
          consent to.
      adult.emotionalAbuse:
        title: Psychological or emotional abuse
        meaning: con:AdultEmotionalAbuse
        description: >-
          Includes threats, humiliation, controlling, intimidation, coercion,
          harassment, verbal abuse, isolation, and withdrawal from services or
          support.
      adult.financialAbuse:
        title: Financial or material abuse
        meaning: con:AdultFinancialAbuse
        description: >-
          Includes theft, fraud, scams, coercion over financial affairs, and
          misuse of property, possessions or benefits.
      adult.modernSlavery:
        title: Modern slavery
        meaning: con:AdultModernSlavery
        description: >-
          Includes slavery, human trafficking, forced labour and domestic
          servitude.
      adult.discriminatoryAbuse:
        title: Discriminatory abuse
        meaning: con:AdultDiscriminatoryAbuse
        description: >-
          Harassment, slurs or similar treatment because of a protected
          characteristic such as race, sex, age, disability, religion or sexual
          orientation.
      adult.organisationalAbuse:
        title: Organisational or institutional abuse
        meaning: con:AdultOrganisationalAbuse
        description: >-
          Neglect and poor practice within an institution or care setting, or in
          care provided at home, from one-off incidents to ongoing ill-treatment.
      adult.neglect:
        title: Neglect or acts of omission
        meaning: con:AdultNeglect
        description: >-
          Includes ignoring medical, emotional or physical care needs, failing to
          provide access to services, and withholding medication, food or
          heating.
      adult.selfNeglect:
        title: Self-neglect
        meaning: con:AdultSelfNeglect
        description: >-
          Neglecting one's own personal hygiene, health or surroundings,
          including hoarding.
      adult.other:
        title: Other
        meaning: con:AdultOther
        description: >-
          A concern about an adult that does not fit the categories above.
          Describe it in the concern's description.

  QocConcernCode:
    enum_uri: ref:qoc-concern-code
    title: Quality-of-Care Concerns
    description: >-
      The nature of a quality-of-care concern about a care provider or service.
      Each type is one of the fundamental standards in Regulations 9 to 20 of
      the Health and Social Care Act 2008 (Regulated Activities) Regulations
      2014, which every CQC-registered provider must meet: a concern of that
      type is a concern that the provider is not meeting that regulation. One
      incident may relate to several regulations (a missed home-care visit, for
      example, may concern Regulations 9, 12 and 18), in which case record a
      concern for each. UNASSIGNED marks a concern that was not classified when
      it was raised, to be assigned at triage.
    permissible_values:
      UNASSIGNED:
        title: Unassigned
        meaning: qcon:Unassigned
        description: >-
          Not yet classified. The concern has been described but no type was
          given when it was raised, either by the person raising it or because
          the form did not ask; the type is assigned at triage, by professionals.
      personCentredCare:
        title: Person-centred care (Regulation 9)
        meaning: qcon:PersonCentredCare
        description: >-
          Concerns that care does not meet the person's needs or reflect their
          preferences. For example, care plans not being followed; home-care
          visits that are missed, late or cut short; or the person and their
          family not being involved in decisions about their care.
      dignityAndRespect:
        title: Dignity and respect (Regulation 10)
        meaning: qcon:DignityAndRespect
        description: >-
          Concerns that people are not treated with dignity and respect. For
          example, a lack of privacy during personal care, being left in soiled
          clothing or bedding, being spoken to disrespectfully, or not being
          supported to stay independent.
      needForConsent:
        title: Need for consent (Regulation 11)
        meaning: qcon:NeedForConsent
        description: >-
          Concerns that care or treatment is given without the person's
          consent, or without following the Mental Capacity Act 2005 where the
          person lacks capacity to consent.
      safeCareAndTreatment:
        title: Safe care and treatment (Regulation 12)
        meaning: qcon:SafeCareAndTreatment
        description: >-
          Concerns that care or treatment is unsafe. For example, medication
          errors (missed, late or wrong doses), avoidable falls or pressure
          ulcers, unsafe moving and handling, poor infection control, or missed
          or late home-care visits that leave the person at risk, such as a
          missed medication visit.
      safeguarding:
        title: Safeguarding service users from abuse and improper treatment (Regulation 13)
        meaning: qcon:Safeguarding
        description: >-
          Concerns that people are not protected from abuse or improper
          treatment. For example, abuse or neglect by staff, theft from
          residents, degrading treatment, or restraint or deprivation of liberty
          without lawful authority. Where a particular person is at risk of
          harm, also raise an adult safeguarding referral and link the two
          records.
      nutritionAndHydration:
        title: Meeting nutritional and hydration needs (Regulation 14)
        meaning: qcon:NutritionAndHydration
        description: >-
          Concerns that people do not get enough to eat and drink, or the help
          they need to eat and drink. For example, food or drink left out of
          reach, unexplained weight loss or dehydration, or dietary, medical or
          cultural needs being ignored.
      premisesAndEquipment:
        title: Premises and equipment (Regulation 15)
        meaning: qcon:PremisesAndEquipment
        description: >-
          Concerns about the premises or equipment used for care. For example,
          dirty or unsafe premises, poor maintenance or security, or equipment
          such as hoists, call bells or pressure-relieving mattresses missing,
          broken or not maintained.
      complaints:
        title: Receiving and acting on complaints (Regulation 16)
        meaning: qcon:Complaints
        description: >-
          Concerns about how the provider handles complaints. For example,
          complaints being ignored or not investigated, or people being afraid
          to complain.
      goodGovernance:
        title: Good governance (Regulation 17)
        meaning: qcon:GoodGovernance
        description: >-
          Concerns about how the service is run and overseen. For example,
          missing or inaccurate care records, no effective checks on the quality
          and safety of care, or the provider not acting on feedback or known
          problems.
      staffing:
        title: Staffing (Regulation 18)
        meaning: qcon:Staffing
        description: >-
          Concerns that there are not enough suitably skilled staff. For
          example, persistent understaffing, staff without the training,
          supervision or skills their role needs, or home-care visits missed,
          late or shortened because of staff shortages.
      fitAndProperPersons:
        title: Fit and proper persons employed (Regulation 19)
        meaning: qcon:FitAndProperPersons
        description: >-
          Concerns that the provider employs people who are not suitable for
          their role. For example, staff working without the required
          recruitment or DBS checks.
      dutyOfCandour:
        title: Duty of candour (Regulation 20)
        meaning: qcon:DutyOfCandour
        description: >-
          Concerns that the provider has not been open and honest when something
          has gone wrong. For example, not telling the person or their family
          about a serious incident, or not apologising or explaining what
          happened.
      other:
        title: Other
        meaning: qcon:Other
        description: >-
          A concern that does not fit any of the regulations above, for example
          about a service that is not registered with CQC. Describe it in the
          concern's description.

  RequestPurposeCode:
    enum_uri: ref:request-purpose
    title: Request Purposes
    description: >-
      The purpose of an outward request for services. Requests are made at
      any stage of a person's involvement with social care: some carry out a
      front-door decision (such as a MASH decision in children's services),
      others come from ongoing work, such as asking for specialist support
      alongside a plan. Where a purpose has a statutory basis or implies
      urgency (such as escalation to a section 47 or section 42 enquiry), the
      code carries it. A request may
      go to a team within the same local authority (for example, the team that
      carries out child in need assessments) as well as to an outside service,
      whether statutory (eg. advocacy or CAMHS) or non-statutory (eg. a community
      organisation).
      This list is likely to change as safeguarding practice and workflows
      change, and will be updated accordingly, most likely by adding new
      purposes.
    permissible_values:
      notification:
        title: Notification or signposting
        meaning: rp:Notification
        description: >-
          Letting a service know about the person, or signposting the person to
          it, without asking it to take action. Used where no further
          involvement is needed but another service should be aware.
      child.earlyHelp:
        title: Request to Early Help services
        meaning: rp:ChildEarlyHelp
        description: >-
          Request for early help: support for the child and family where needs
          do not meet the threshold for statutory children's social care, as set
          out in Working Together to Safeguard Children 2023.
      child.CIN:
        title: Escalation to s17 CiN assessment
        meaning: rp:ChildCIN
        description: >-
          Request for an assessment of whether the child is a child in need,
          under section 17 of the Children Act 1989.
        aliases: ["child.cin"]
      child.s47:
        title: Escalation to s47 enquiry
        meaning: rp:ChildS47
        description: >-
          Escalation to enquiries under section 47 of the Children Act 1989,
          where there is reasonable cause to suspect the child is suffering, or
          is likely to suffer, significant harm. Normally follows a strategy
          discussion.
      child.emergency:
        title: Immediate emergency protection
        meaning: rp:ChildEmergency
        description: >-
          Immediate action to protect the child, such as police protection
          (section 46 of the Children Act 1989) or an emergency protection order
          (section 44).
      child.statutoryServices:
        title: Request to statutory services (like CAMHS or advocacy)
        meaning: rp:ChildStatutoryServices
        description: >-
          Request to a statutory service other than children's social care, such
          as child and adolescent mental health services or independent
          advocacy.
      child.nonStatutoryServices:
        title: Request to non-statutory services
        meaning: rp:ChildNonStatutoryServices
        description: >-
          Request to a voluntary, community or other non-statutory service.
      adult.prevention:
        title: Request for prevention or reablement services
        meaning: rp:AdultPrevention
        description: >-
          Request for services that prevent, reduce or delay the need for care
          and support, under section 2 of the Care Act 2014. For example,
          reablement, intermediate care, or equipment and minor adaptations.
      adult.needsAssessment:
        title: Request for Care Act needs or carer's assessment
        meaning: rp:AdultNeedsAssessment
        description: >-
          Request for a needs assessment (section 9 of the Care Act 2014) or a
          carer's assessment (section 10).
      adult.s42Enquiry:
        title: Escalation to s42 safeguarding enquiry
        meaning: rp:AdultS42Enquiry
        description: >-
          Escalation to an enquiry under section 42 of the Care Act 2014, where
          an adult with care and support needs is experiencing, or is at risk
          of, abuse or neglect and cannot protect themselves because of those
          needs.
      adult.statutoryServices:
        title: Request to statutory services (like NHS CHC or advocacy)
        meaning: rp:AdultStatutoryServices
        description: >-
          Request to a statutory service other than adult social care, such as
          NHS Continuing Healthcare or independent advocacy.
      adult.nonStatutoryServices:
        title: Request to non-statutory services
        meaning: rp:AdultNonStatutoryServices
        description: >-
          Request to a voluntary, community or other non-statutory service.

  ReferralQuestionCategory:
