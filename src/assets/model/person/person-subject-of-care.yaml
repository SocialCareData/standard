id: https://ns.socialcaredata.io/person/subject-of-care
name: person-subject-of-care
title: Person Standard - Subject of Care profile
description: >-
  Conformance profile for a p:Person who is the *subject of care*. Imports the
  shared core (person-standard.yaml) and redefines Person, tightening the
  cardinalities so that the core identity, demographic and contact data required
  to deliver and coordinate care are present. Sub-entity shapes (Identifier,
  Name, Address, Contact, PersonRelationship, PartialDate) and all controlled
  vocabularies are inherited unchanged from the core.

  SHACL generated from this file is the LinkML equivalent of the hand-written
  manual-person-subject-of-care-shacl-shape.ttl.
license: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  p: https://ns.socialcaredata.io/person/
default_prefix: p
imports:
  - linkml:types
  - person-standard

# ---------------------------------------------------------------------------
# Person (Subject of Care)
#
#   identifier                  1..*
#   name                        1..1
#   dateOfBirth                 1..1
#   isDeceased                  1..1
#   deceasedDate                0..1
#   address                     1..*
#   contact                     0..*
#   genderCode                  1..1
#   sexCode                     0..1
#   ethnicityCode               1..1
#   relatedPerson               0..*
#   primaryContactProfessional  0..*
#   matchedPersonRef            0..*
# ---------------------------------------------------------------------------
classes:

  Person:
    class_uri: p:Person
    tree_root: true
    description: >-
      A person who is the subject of care. Core identity, demographic and
      contact data required to deliver and coordinate care must be present.
    slots:
      - identifier
      - name
      - dateOfBirth
      - isDeceased
      - deceasedDate
      - address
      - contact
      - genderCode
      - sexCode
      - ethnicityCode
      - relatedPerson
      - primaryContactProfessional
      - matchedPersonRef
    slot_usage:
      identifier:
        required: true
        multivalued: true
        description: Subject-of-care Person must have at least one Identifier.
      name:
        required: true
        multivalued: false
        description: Subject-of-care Person must have exactly one Name.
      dateOfBirth:
        required: true
        multivalued: false
        description: Subject-of-care Person must have exactly one dateOfBirth.
      isDeceased:
        required: true
        multivalued: false
        description: Subject-of-care Person must record isDeceased.
      address:
        required: true
        multivalued: true
        description: Subject-of-care Person must have at least one Address.
      contact:
        required: false
        multivalued: true
        description: Contact information (multi-valued, optional).
      genderCode:
        required: true
        multivalued: false
        description: Subject-of-care Person must have exactly one genderCode.
      ethnicityCode:
        required: true
        multivalued: false
        description: Subject-of-care Person must have exactly one ethnicityCode (ONS 2021 census 20b).
      relatedPerson:
        required: false
        multivalued: true
        description: Related people (multi-valued, optional).
