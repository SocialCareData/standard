id: https://ns.socialcaredata.io/person/schema
name: person
title: Person Standard Data Model
description: >-
  A single LinkML data model for the Person Standard: a common data model for
  identifying and describing a person across social care systems, designed to
  unblock multi-agency information sharing (MAIS) and Single View use cases.

  This schema is the authoritative *shared core*. It defines every sub-entity
  (Identifier, Name, Address, Contact, PersonRelationship, PartialDate), every
  slot, every controlled vocabulary, and a canonical base `Person`. The two
  conformance profiles - `person-subject-of-care.yaml` and
  `person-connected.yaml` - import this file and redefine `Person` with the
  cardinalities appropriate to a person who is the subject of care versus a
  related/connected person. SHACL is generated from the two profile files.
license: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  p: https://ns.socialcaredata.io/person/
  nuc: https://ns.socialcaredata.io/person/name-use-code#
  auc: https://ns.socialcaredata.io/person/address-use-code#
  gc: https://ns.socialcaredata.io/person/gender-code#
  psc: https://ns.socialcaredata.io/person/phenotypic-sex-code#
  ec: https://ns.socialcaredata.io/person/ethnicity-code#
  prc: https://ns.socialcaredata.io/person/person-relationship-code#
  skos: http://www.w3.org/2004/02/skos/core#
  dct: http://purl.org/dc/terms/
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: p
default_range: string
imports:
  - linkml:types

# ---------------------------------------------------------------------------
# Classes
# ---------------------------------------------------------------------------
classes:

  Person:
    class_uri: p:Person
    tree_root: true
    description: >-
      The top-level record describing an individual. Consolidates the core
      identity attributes required to distinguish one person from another and to
      record relationships between individuals. This is the canonical base
      Person; the two conformance profiles tighten the cardinalities below.
    slots:
      - identifier
      - name
      - dateOfBirth
      - isDeceased
      - deceasedDate
      - address
      - contact
      - genderCode
      - sexCode
      - ethnicityCode
      - relatedPerson
      - primaryContactProfessional
      - matchedPersonRef

  Identifier:
    class_uri: p:Identifier
    description: >-
      A single identifier for a person, comprising the value and the system in
      whose namespace the value is unique. Aligned with FHIR Identifier and the
      NHS PDS UNIQUE_REFERENCE definition.
    slots:
      - value
      - system

  Name:
    class_uri: p:Name
    description: >-
      Container for a person's name parts, aligned with FHIR HumanName. A person
      may have multiple names with different uses.
    slots:
      - familyName
      - givenName
      - preferredName
      - nameUse

  Address:
    class_uri: p:Address
    description: >-
      A postal address for the person. Aligned with FHIR Address. UPRN and USRN
      support property- and street-level disambiguation.
    slots:
      - line1
      - line2
      - city
      - postcode
      - UPRN
      - USRN
      - addressUse

  Contact:
    class_uri: p:Contact
    description: >-
      Contact details for a person, such as a home, work, or other contact
      channel grouping.
    slots:
      - contactName
      - email
      - telephone

  PersonRelationship:
    class_uri: p:PersonRelationship
    description: >-
      A typed reference from one person to another. The reference is by
      Identifier (so the related person may live in a different system) and is
      qualified by one or more relationship codes.
    slots:
      - identifier
      - relationship
    slot_usage:
      identifier:
        required: true
        multivalued: false
        description: Reference to the related person's Identifier (system + value).

  PartialDate:
    class_uri: p:PartialDate
    description: >-
      Container for a date that may not be fully known or precise, extended with
      an accuracy indicator. Used for dates of birth and dates of death.
    slots:
      - date
      - accuracyIndicator

# ---------------------------------------------------------------------------
# Slots
# ---------------------------------------------------------------------------
slots:

  # --- Person ---
  identifier:
    slot_uri: p:identifier
    range: Identifier
    multivalued: true
    required: false
    description: >-
      Unique identifiers associated with the person (e.g. NHS number, internal
      case-management system ID).
  name:
    slot_uri: p:name
    range: Name
    multivalued: false
    required: true
    description: >-
      A name for the person, with a usage indicating its purpose (usual, maiden,
      nickname, etc.).
  dateOfBirth:
    slot_uri: p:dateOfBirth
    range: PartialDate
    multivalued: false
    required: false
    description: The person's date of birth, with an optional accuracy indicator.
  isDeceased:
    slot_uri: p:isDeceased
    range: boolean
    multivalued: false
    required: false
    description: Whether the person is deceased.
  deceasedDate:
    slot_uri: p:deceasedDate
    range: PartialDate
    multivalued: false
    required: false
    description: >-
      The person's date of death, with an optional accuracy indicator. isDeceased
      may be true without a known date.
  address:
    slot_uri: p:address
    range: Address
    multivalued: true
    required: false
    description: Physical addresses where the person can be contacted.
  contact:
    slot_uri: p:contact
    range: Contact
    multivalued: true
    required: false
    description: The person's contact information.
  genderCode:
    slot_uri: p:genderCode
    range: GenderCode
    multivalued: false
    required: false
    description: The person's stated gender.
  sexCode:
    slot_uri: p:sexCode
    range: PhenotypicSexCode
    multivalued: false
    required: false
    description: Observed phenotypic sex, where recorded.
  ethnicityCode:
    slot_uri: p:ethnicityCode
    range: EthnicityCode
    multivalued: false
    required: false
    description: >-
      The person's stated ethnicity, using the ONS 18+1 categories from the 2021
      census. Statutorily required in adult social care; optional elsewhere.
  relatedPerson:
    slot_uri: p:relatedPerson
    range: PersonRelationship
    multivalued: true
    required: false
    description: >-
      References to other people related to this person, with the kind of
      relationship.
  primaryContactProfessional:
    slot_uri: p:primaryContactProfessional
    range: Identifier
    multivalued: true
    required: false
    description: >-
      References to the primary professionals related to this person (e.g. care
      coordinators or a GP). Until the Professional standard is published,
      recorded using the Identifier structure (system + value).
  matchedPersonRef:
    slot_uri: p:matchedPersonRef
    range: Identifier
    multivalued: true
    required: false
    description: >-
      References to other Person records where a cross-system match has been
      identified. Uses the Identifier structure.

  # --- Identifier ---
  value:
    slot_uri: p:value
    range: string
    required: true
    multivalued: false
    description: The identifier value, unique within the issuing system.
  system:
    slot_uri: p:system
    range: uri
    required: true
    multivalued: false
    description: >-
      The URI of the system or namespace within which the identifier is unique
      (e.g. https://fhir.nhs.uk/Id/nhs-number).

  # --- Name ---
  familyName:
    slot_uri: p:familyName
    range: string
    required: true
    multivalued: true
    description: >-
      The surname or family name. Multi-valued to support compound or hyphenated
      family names recorded as separate parts.
  givenName:
    slot_uri: p:givenName
    range: string
    required: true
    multivalued: true
    description: The first name and any middle names.
  preferredName:
    slot_uri: p:preferredName
    range: string
    required: false
    multivalued: false
    description: >-
      Any preferred given or middle name used by the person - for example, "Joe"
      where their legal first name is "Joseph".
  nameUse:
    slot_uri: p:use
    title: use
    range: NameUseCode
    required: false
    multivalued: false
    description: The purpose of this name instance - usual, official, former, etc.

  # --- Address ---
  line1:
    slot_uri: p:line1
    range: string
    required: true
    multivalued: false
    description: Street address (e.g. "1 High Street") or care-of line.
  line2:
    slot_uri: p:line2
    range: string
    required: false
    multivalued: false
    description: Apartment, suite, unit, building, floor, etc.
  city:
    slot_uri: p:city
    range: string
    required: true
    multivalued: false
    description: City, town, or village.
  postcode:
    slot_uri: p:postcode
    range: string
    required: true
    multivalued: false
    pattern: "^[A-Z]{1,2}[0-9][0-9A-Z]? ?[0-9][A-Z]{2}$"
    description: UK postcode in standard format (e.g. AB1 2CD).
  UPRN:
    slot_uri: p:UPRN
    range: string
    required: false
    multivalued: false
    description: Unique Property Reference Number of the address.
  USRN:
    slot_uri: p:USRN
    range: string
    required: false
    multivalued: false
    description: Unique Street Reference Number of the address.
  addressUse:
    slot_uri: p:use
    title: use
    range: AddressUseCode
    required: false
    multivalued: false
    description: How this address is used - home, work, temp, etc.

  # --- Contact ---
  contactName:
    slot_uri: p:contactName
    title: name
    range: string
    required: false
    multivalued: false
    description: Name of the contact type (for example, "Home", "Work", "Other").
  email:
    slot_uri: p:email
    range: string
    required: false
    multivalued: true
    description: One or more email addresses.
  telephone:
    slot_uri: p:telephone
    range: string
    required: false
    multivalued: true
    description: One or more telephone numbers.

  # --- PersonRelationship ---
  relationship:
    slot_uri: p:relationship
    range: PersonRelationshipCode
    required: true
    multivalued: true
    description: One or more codes describing the kind of relationship.

  # --- PartialDate ---
  date:
    slot_uri: p:date
    range: date
    required: true
    multivalued: false
    description: ISO 8601-formatted date (YYYY-MM-DD).
  accuracyIndicator:
    slot_uri: p:accuracyIndicator
    range: string
    required: false
    multivalued: false
    pattern: "^[AEU]{3}$"
    description: >-
      A three-character code in day-month-year order indicating which parts of
      the date are accurate (A), estimated (E), or unknown (U).

# ---------------------------------------------------------------------------
# Enums (controlled vocabularies / SKOS concept schemes)
# ---------------------------------------------------------------------------
enums:

  NameUseCode:
    enum_uri: p:name-use-code
    title: Name Use Code
    description: >-
      The intended purpose of a person's name. Aligned with the FHIR name-use
      value set.
    permissible_values:
      usual:
        title: Usual name
        meaning: nuc:Usual
        description: The name commonly used by the person - what they normally go by.
      official:
        title: Official name
        meaning: nuc:Official
        description: The formal name registered in a government register.
      temp:
        title: Temporary name
        meaning: nuc:Temp
        description: A temporary name; assigned at birth, in emergencies, or where the full name is not yet known.
      nickname:
        title: Nickname
        meaning: nuc:Nickname
        description: An informal name not part of the person's formal or usual name.
      anonymous:
        title: Anonymous
        meaning: nuc:Anonymous
        description: A pseudonym used to protect the person's privacy.
      old:
        title: Old name
        meaning: nuc:Old
        description: A name no longer in use, retained for record-matching purposes.
      maiden:
        title: Maiden name
        meaning: nuc:Maiden
        description: A name used prior to marriage. Applies regardless of gender.

  AddressUseCode:
    enum_uri: p:address-use-code
    title: Address Use Code
    description: >-
      How an address is used. Aligned with the FHIR address-use value set.
    permissible_values:
      home:
        title: Home
        meaning: auc:Home
        description: A communication address at a home.
      work:
        title: Work
        meaning: auc:Work
        description: An office address. First choice for business-related contacts during business hours.
      temp:
        title: Temporary
        meaning: auc:Temp
        description: A temporary address.
      old:
        title: Old / Incorrect
        meaning: auc:Old
        description: This address is no longer in use (or was never correct but retained for records).
      billing:
        title: Billing
        meaning: auc:Billing
        description: An address to be used to send bills, invoices, receipts etc.

  GenderCode:
    enum_uri: p:gender-code
    title: Gender Code
    description: >-
      A person's stated gender identity, as distinct from biological sex. Aligned
      with NHS PERSON_STATED_GENDER_CODE.
    permissible_values:
      "1":
        title: Male
        meaning: gc:Male
        description: The person identifies as male.
      "2":
        title: Female
        meaning: gc:Female
        description: The person identifies as female.
      "9":
        title: Indeterminate
        meaning: gc:Indeterminate
        description: Unable to be classified as either male or female.
      X:
        title: Not Known
        meaning: gc:NotKnown
        description: Not recorded, or information unavailable.

  PhenotypicSexCode:
    enum_uri: p:phenotypic-sex-code
    title: Phenotypic Sex Code
    description: >-
      Observed phenotypic sex where recorded, representing biological
      characteristics rather than gender identity. Aligned with NHS PDS
      PERSON_PHENOTYPIC_SEX.
    permissible_values:
      "1":
        title: Male
        meaning: psc:Male
        description: The person is phenotypically male.
      "2":
        title: Female
        meaning: psc:Female
        description: The person is phenotypically female.
      "9":
        title: Indeterminate
        meaning: psc:Indeterminate
        description: Unable to be classified phenotypically as either male or female.
      X:
        title: Not Known
        meaning: psc:NotKnown
        description: Not recorded, or information unavailable.

  EthnicityCode:
    enum_uri: p:ethnicity-code
    title: Ethnicity Code
    description: >-
      The person's stated ethnicity. Uses ONS Census 2021 Ethnic group
      classification 20b codes.
    permissible_values:
      "1":
        title: "Asian, Asian British or Asian Welsh: Bangladeshi"
        meaning: ec:AsianBangladeshi
      "2":
        title: "Asian, Asian British or Asian Welsh: Chinese"
        meaning: ec:AsianChinese
      "3":
        title: "Asian, Asian British or Asian Welsh: Indian"
        meaning: ec:AsianIndian
      "4":
        title: "Asian, Asian British or Asian Welsh: Pakistani"
        meaning: ec:AsianPakistani
      "5":
        title: "Asian, Asian British or Asian Welsh: Other Asian"
        meaning: ec:AsianOther
      "6":
        title: "Black, Black British, Black Welsh, Caribbean or African: African"
        meaning: ec:BlackAfrican
      "7":
        title: "Black, Black British, Black Welsh, Caribbean or African: Caribbean"
        meaning: ec:BlackCaribbean
      "8":
        title: "Black, Black British, Black Welsh, Caribbean or African: Other Black"
        meaning: ec:BlackOther
      "9":
        title: "Mixed or Multiple ethnic groups: White and Asian"
        meaning: ec:MixedWhiteAsian
      "10":
        title: "Mixed or Multiple ethnic groups: White and Black African"
        meaning: ec:MixedWhiteBlackAfrican
      "11":
        title: "Mixed or Multiple ethnic groups: White and Black Caribbean"
        meaning: ec:MixedWhiteBlackCaribbean
      "12":
        title: "Mixed or Multiple ethnic groups: Other Mixed or Multiple ethnic groups"
        meaning: ec:MixedOther
      "13":
        title: "White: English, Welsh, Scottish, Northern Irish or British"
        meaning: ec:WhiteBritish
      "14":
        title: "White: Irish"
        meaning: ec:WhiteIrish
      "15":
        title: "White: Gypsy or Irish Traveller"
        meaning: ec:WhiteGypsyOrIrishTraveller
      "16":
        title: "White: Roma"
        meaning: ec:WhiteRoma
      "17":
        title: "White: Other White"
        meaning: ec:WhiteOther
      "18":
        title: "Other ethnic group: Arab"
        meaning: ec:OtherArab
      "19":
        title: "Other ethnic group: Any other ethnic group"
        meaning: ec:OtherAny
      "-8":
        title: "Does not apply (Students and schoolchildren living away during term-time)"
        meaning: ec:DoesNotApply

  PersonRelationshipCode:
    enum_uri: p:person-relationship-code
    title: Person Relationship Code
    description: >-
      HL7 v3 PersonalRelationshipRoleType concepts describing personal
      relationships between individuals (family, spousal, foster, adoptive, other).
    permissible_values:
      FAMMEMB:
        title: "Family member"
        meaning: prc:FAMMEMB
        description: "A familial relationship between two people."
      CHILD:
        title: "Child"
        meaning: prc:CHILD
        description: "Offspring of the scoping person."
      NCHILD:
        title: "Natural child"
        meaning: prc:NCHILD
        description: "Offspring determined by birth."
      CHLDADOPT:
        title: "Adopted child"
        meaning: prc:CHLDADOPT
        description: "A child legally adopted and raised by the scoping person."
      DAUADOPT:
        title: "Adopted daughter"
        meaning: prc:DAUADOPT
        description: "A female child legally adopted and raised by the scoping person."
      SONADOPT:
        title: "Adopted son"
        meaning: prc:SONADOPT
        description: "A male child legally adopted and raised by the scoping person."
      CHLDFOST:
        title: "Foster child"
        meaning: prc:CHLDFOST
        description: "A child receiving parental care without legal or blood ties."
      DAUFOST:
        title: "Foster daughter"
        meaning: prc:DAUFOST
        description: "A female child receiving foster parental care."
      SONFOST:
        title: "Foster son"
        meaning: prc:SONFOST
        description: "A male child receiving foster parental care."
      DAUC:
        title: "Daughter"
        meaning: prc:DAUC
        description: "A female child (of any type) of the scoping person."
      DAU:
        title: "Natural daughter"
        meaning: prc:DAU
        description: "Female offspring of the scoping person."
      STPDAU:
        title: "Stepdaughter"
        meaning: prc:STPDAU
        description: "A daughter of the scoping person's spouse by a previous union."
      SON:
        title: "Natural son"
        meaning: prc:SON
        description: "Male offspring of the scoping person."
      SONC:
        title: "Son"
        meaning: prc:SONC
        description: "A male child (of any type) of the scoping person."
      STPSON:
        title: "Stepson"
        meaning: prc:STPSON
        description: "A son of the scoping person's spouse by a previous union."
      STPCHLD:
        title: "Stepchild"
        meaning: prc:STPCHLD
        description: "A child of the scoping person's spouse by a previous union."
      EXT:
        title: "Extended family member"
        meaning: prc:EXT
        description: "A non-immediate genetic or legal relative (e.g. aunt, cousin)."
      AUNT:
        title: "Aunt"
        meaning: prc:AUNT
        description: "Sister of the scoping person's parent."
      MAUNT:
        title: "Maternal aunt"
        meaning: prc:MAUNT
        description: "Biological sister of the scoping person's biological mother."
      PAUNT:
        title: "Paternal aunt"
        meaning: prc:PAUNT
        description: "Biological sister of the scoping person's biological father."
      UNCLE:
        title: "Uncle"
        meaning: prc:UNCLE
        description: "Brother of the scoping person's parent."
      MUNCLE:
        title: "Maternal uncle"
        meaning: prc:MUNCLE
        description: "Biological brother of the scoping person's biological mother."
      PUNCLE:
        title: "Paternal uncle"
        meaning: prc:PUNCLE
        description: "Biological brother of the scoping person's biological father."
      COUSN:
        title: "Cousin"
        meaning: prc:COUSN
        description: "A relative descended from a common ancestor by multiple steps."
      MCOUSN:
        title: "Maternal cousin"
        meaning: prc:MCOUSN
        description: "Biological relative via the scoping person's mother's line."
      PCOUSN:
        title: "Paternal cousin"
        meaning: prc:PCOUSN
        description: "Biological relative via the scoping person's father's line."
      NIENEPH:
        title: "Niece/nephew"
        meaning: prc:NIENEPH
        description: "Child of the scoping person's sibling."
      NEPHEW:
        title: "Nephew"
        meaning: prc:NEPHEW
        description: "Son of the scoping person's sibling."
      NIECE:
        title: "Niece"
        meaning: prc:NIECE
        description: "Daughter of the scoping person's sibling."
      GGRPRN:
        title: "Great-grandparent"
        meaning: prc:GGRPRN
        description: "Parent of the scoping person's grandparent."
      GGRFTH:
        title: "Great-grandfather"
        meaning: prc:GGRFTH
        description: "Father of the scoping person's grandparent."
      MGGRFTH:
        title: "Maternal great-grandfather"
        meaning: prc:MGGRFTH
        description: "Biological father of the scoping person's maternal grandparent."
      PGGRFTH:
        title: "Paternal great-grandfather"
        meaning: prc:PGGRFTH
        description: "Biological father of the scoping person's paternal grandparent."
      GGRMTH:
        title: "Great-grandmother"
        meaning: prc:GGRMTH
        description: "Mother of the scoping person's grandparent."
      MGGRMTH:
        title: "Maternal great-grandmother"
        meaning: prc:MGGRMTH
        description: "Biological mother of the scoping person's maternal grandparent."
      PGGRMTH:
        title: "Paternal great-grandmother"
        meaning: prc:PGGRMTH
        description: "Biological mother of the scoping person's paternal grandparent."
      MGGRPRN:
        title: "Maternal great-grandparent"
        meaning: prc:MGGRPRN
        description: "Biological parent of the scoping person's maternal grandparent."
      PGGRPRN:
        title: "Paternal great-grandparent"
        meaning: prc:PGGRPRN
        description: "Biological parent of the scoping person's paternal grandparent."
      GRPRN:
        title: "Grandparent"
        meaning: prc:GRPRN
        description: "Parent of the scoping person's parent."
      GRFTH:
        title: "Grandfather"
        meaning: prc:GRFTH
        description: "Father of the scoping person's parent."
      MGRFTH:
        title: "Maternal grandfather"
        meaning: prc:MGRFTH
        description: "Biological father of the scoping person's biological mother."
      PGRFTH:
        title: "Paternal grandfather"
        meaning: prc:PGRFTH
        description: "Biological father of the scoping person's biological father."
      GRMTH:
        title: "Grandmother"
        meaning: prc:GRMTH
        description: "Mother of the scoping person's parent."
      MGRMTH:
        title: "Maternal grandmother"
        meaning: prc:MGRMTH
        description: "Biological mother of the scoping person's biological mother."
      PGRMTH:
        title: "Paternal grandmother"
        meaning: prc:PGRMTH
        description: "Biological mother of the scoping person's biological father."
      MGRPRN:
        title: "Maternal grandparent"
        meaning: prc:MGRPRN
        description: "Biological parent of the scoping person's biological mother."
      PGRPRN:
        title: "Paternal grandparent"
        meaning: prc:PGRPRN
        description: "Biological parent of the scoping person's biological father."
      GRNDCHILD:
        title: "Grandchild"
        meaning: prc:GRNDCHILD
        description: "Child of the scoping person's son or daughter."
      GRNDDAU:
        title: "Granddaughter"
        meaning: prc:GRNDDAU
        description: "Daughter of the scoping person's child."
      GRNDSON:
        title: "Grandson"
        meaning: prc:GRNDSON
        description: "Son of the scoping person's child."
      INLAW:
        title: "In-law"
        meaning: prc:INLAW
        description: "A member of the scoping person's spouse's immediate family."
      CHLDINLAW:
        title: "Child-in-law"
        meaning: prc:CHLDINLAW
        description: "Spouse of the scoping person's child."
      DAUINLAW:
        title: "Daughter-in-law"
        meaning: prc:DAUINLAW
        description: "Wife of the scoping person's son."
      SONINLAW:
        title: "Son-in-law"
        meaning: prc:SONINLAW
        description: "Husband of the scoping person's daughter."
      PRNINLAW:
        title: "Parent-in-law"
        meaning: prc:PRNINLAW
        description: "A parent of the scoping person's spouse."
      FTHINLAW:
        title: "Father-in-law"
        meaning: prc:FTHINLAW
        description: "Father of the scoping person's spouse."
      MTHINLAW:
        title: "Mother-in-law"
        meaning: prc:MTHINLAW
        description: "Mother of the scoping person's spouse."
      SIBINLAW:
        title: "Sibling-in-law"
        meaning: prc:SIBINLAW
        description: "The spouse's sibling or the spouse of the scoping person's sibling."
      BROINLAW:
        title: "Brother-in-law"
        meaning: prc:BROINLAW
        description: "The spouse's brother, or the husband of the scoping person's sister."
      SISINLAW:
        title: "Sister-in-law"
        meaning: prc:SISINLAW
        description: "The spouse's sister, or the wife of the scoping person's brother."
      PRN:
        title: "Parent"
        meaning: prc:PRN
        description: "One who begets, gives birth to, or raises the scoping person."
