        meaning: sd:OtherShortTerm
      nursing:
        title: Nursing
        description: "Long term support: Nursing care"
        meaning: sd:Nursing
      residential:
        title: Residential
        description: "Long term support: Residential care"
        meaning: sd:Residential
      community:
        title: Community
        description: "Long term support: Community"
        meaning: sd:Community
      prison:
        title: Prison
        description: "Long term support: Prison"
        meaning: sd:Prison
      unpaid-carer-direct:
        title: Unpaid Carer Direct
        description: "Unpaid carer support: Direct to unpaid carer"
        meaning: sd:UnpaidCarerDirect
      unpaid-carer-support:
        title: Unpaid Carer Support
        description: "Unpaid carer support: Support involving the person cared-for"
        meaning: sd:UnpaidCarerSupport

  EpisodeCode:
    enum_uri: sg:episode-code
    title: Episode Code
    description: Codes to indicate the type of service episode.
    permissible_values:
      early-help:
        title: Early Help
        description: Early Help Assessment / Intervention
        meaning: epc:EarlyHelp
      ehcp:
        title: EHCP
        description: Education, Health, and Care plan
        meaning: epc:Ehcp
      family-court-order:
