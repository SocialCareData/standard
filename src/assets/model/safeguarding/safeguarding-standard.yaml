id: https://ns.socialcaredata.io/safeguarding/schema
name: safeguarding
title: Safeguarding Standard Data Model
description: >-
  A LinkML data model for the Safeguarding Standard: a common data model for
  recording the services, professionals, organisations, service episodes and
  life events involved in safeguarding and promoting the wellbeing of a person,
  to support multi-agency information sharing (MAIS).

  The model is organised around five top-level entities - Organisation, Service,
  Professional, ServiceEpisode and LifeEvent - and the shared objects that link
  them together (Identifier, Name, Address, Contact). The shared objects are
  defined once by the Person Standard and imported from person-standard.yaml, so
  this schema reuses their p: ontology IRIs (p:Identifier, p:Name, p:Address,
  p:Contact) rather than redefining them. Coded fields draw their values from the
  controlled vocabularies (enums) declared below.
license: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  sg: https://ns.socialcaredata.io/safeguarding/
  oc: https://ns.socialcaredata.io/safeguarding/organisation-code#
  svc: https://ns.socialcaredata.io/safeguarding/service-code#
  scf: https://ns.socialcaredata.io/safeguarding/service-cost-frequency#
  sd: https://ns.socialcaredata.io/safeguarding/service-delivery#
  epc: https://ns.socialcaredata.io/safeguarding/episode-code#
  eo: https://ns.socialcaredata.io/safeguarding/episode-outcome#
  evc: https://ns.socialcaredata.io/safeguarding/event-code#
  mt: https://ns.socialcaredata.io/safeguarding/measurement-type#
  mu: https://ns.socialcaredata.io/safeguarding/measurement-unit#
  ot: https://ns.socialcaredata.io/safeguarding/observation-type#
  p: https://ns.socialcaredata.io/person/
  skos: http://www.w3.org/2004/02/skos/core#
  dct: http://purl.org/dc/terms/
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: sg
default_range: string
imports:
  - linkml:types
  # Shared objects (Identifier, Name, Address, Contact) and their controlled
  # vocabularies (NameUseCode, AddressUseCode) are defined once by the Person
  # Standard and imported here, so this schema reuses their p: ontology IRIs
  # rather than redefining them. The import is by the Person schema's canonical
  # id; imports.json maps that id to the local person-standard.yaml file so the
  # generated ontology's owl:imports is a clean IRI.
  - https://ns.socialcaredata.io/person/schema

# ---------------------------------------------------------------------------
# Classes
# ---------------------------------------------------------------------------
classes:

  # --- Top-level entities ---------------------------------------------------

  Organisation:
    class_uri: sg:Organisation
    description: >-
      An organisation involved in the safeguarding or wellbeing of a person -
      for example a local authority, an NHS trust, a school, or an education
      authority. Aligns with the FHIR Organization resource.
    slots:
      - sgIdentifier
      - entityName
      - alias
      - organisationType
      - active
      - sgAddress
      - contactMulti
      - relatedProfessionalRef
      - relatedServiceRef
    slot_usage:
      contactMulti:
        required: true
        multivalued: true
        description: Contact information for the organisation.
      relatedServiceRef:
        required: true
        multivalued: true
        description: References to Services the organisation provides or contributes to.

  Service:
    class_uri: sg:Service
    description: >-
      A service involved in the safeguarding or wellbeing of a person - the
      specific intervention or package of support delivered by one or more
      organisations (e.g. local authority social care, an emergency department,
      a general practice, or a school).
    slots:
      - sgIdentifier
      - entityName
      - alias
      - serviceType
      - active
      - sgAddress
      - contactMulti
      - costFrequency
      - delivery
      - relatedProfessionalRef
      - relatedOrganisationRef
    slot_usage:
      contactMulti:
        required: true
        multivalued: true
        description: Contact information for the service.

  Professional:
    class_uri: sg:Professional
    description: >-
      An individual acting in a formal role within an organisation who has
      responsibilities relating to a person's safety, wellbeing, care or support
      - for example undertaking assessments, creating and monitoring plans, or
      sharing information in a multi-agency context.
    slots:
      - sgIdentifier
      - professionalName
      - role
      - status
      - contactSingle
      - relatedServiceRef
      - relatedOrganisationRef

  ServiceEpisode:
    class_uri: sg:ServiceEpisode
    description: >-
      A bounded period during which an individual receives a defined service,
      intervention, or package of support from a service or professional. It has
      a recognisable start and end point, though duration may vary from a single
      contact to sustained involvement over time.
    slots:
      - sgIdentifier
      - episodeType
      - subjectPerson
      - relatedProfessionalObj
      - relatedServiceRef
      - timeInformation
      - location
      - finding
      - outcome
    slot_usage:
      relatedServiceRef:
        required: true
        multivalued: true
        description: References to the Services involved in the episode.
      timeInformation:
        required: true
        multivalued: true
        description: Details about the timing of the episode.
      location:
        required: true
        multivalued: true
        description: Details about the location of the episode.

  LifeEvent:
    class_uri: sg:LifeEvent
    description: >-
      A significant, time-bound occurrence in an individual's life that may have
      implications for their safety, wellbeing or development - for example
      attendance at A&E, a child being reported as missing, or an exclusion from
      school. Life events are not inherently positive or negative but can signal
      levels of risk, vulnerability or changing need.
    slots:
      - sgIdentifier
      - eventType
      - subjectPerson
      - relatedProfessionalObj
      - relatedServiceRef
      - timeInformation
      - location

  # --- Linking / supporting objects ----------------------------------------

  SubjectPerson:
    class_uri: sg:SubjectPerson
    description: A typed reference to a Person involved in a service episode or life event.
    slots:
      - person
      - involvement

  RelatedProfessional:
    class_uri: sg:RelatedProfessional
    description: A typed reference to a Professional involved in a service episode or life event.
    slots:
      - professional
      - involvement

  TimeInformation:
    class_uri: sg:TimeInformation
    description: >-
      Details about the timing of a service episode or life event, including
      when it started and ended and how frequently it recurs.
    slots:
      - startDateTime
      - endDateTime
      - frequency

  Any:
    class_uri: linkml:Any
    description: >-
      An open value whose structure is defined and validated elsewhere, not by
      this standard. Serialised as an arbitrary JSON object.

  Finding:
    class_uri: sg:Finding
    description: >-
      An observation or measurement made during the course of a service episode
      about the subject and their circumstances. May be recorded as a structured
      Observation, a quantitative Measurement, and/or free text.
    slots:
      - observation
      - measurement
      - text

  Observation:
    class_uri: sg:Observation
    description: >-
      A qualitative observation that represents an attribute of the subject or
      their circumstances (for example "NEET" or "free-school-meals").
    slots:
      - observationType
      - observationStartDate
      - observationEndDate

  Measurement:
    class_uri: sg:Measurement
    description: >-
      A quantitative measurement of something related to the subject or their
      circumstances (for example "Authorised Absences" or "Referrals").
    slots:
      - measurementValue
      - measurementUnit
      - measurementType

  # --- Shared objects -------------------------------------------------------
  # Identifier, Name, Address and Contact (and the NameUseCode / AddressUseCode
  # vocabularies) are imported from the Person Standard (person-standard.yaml)
  # and reused unchanged, so their p: ontology IRIs (p:Identifier, p:Name,
  # p:Address, p:Contact) are referenced rather than redefined here.

# ---------------------------------------------------------------------------
# Slots
# ---------------------------------------------------------------------------
slots:

  # --- shared / top-level ---
  sgIdentifier:
    slot_uri: sg:identifier
    title: identifier
    range: Identifier
    multivalued: true
    required: true
    description: Unique identifiers associated with the entity.
  entityName:
    slot_uri: sg:name
    title: name
    range: string
    required: true
    multivalued: false
    description: The official name of the organisation or service.
  professionalName:
    slot_uri: sg:name
    title: name
    range: Name
    required: true
    multivalued: false
    description: The professional's name.
  alias:
    slot_uri: sg:alias
    range: string
    required: false
    multivalued: true
    description: Other names the entity is known by.
  active:
    slot_uri: sg:active
    range: boolean
    required: false
    multivalued: false
    description: Code for the entity's status - whether it is currently active.
  sgAddress:
    slot_uri: sg:address
    title: address
    range: Address
    required: false
    multivalued: true
    description: Physical location(s) of the entity.
  contactMulti:
    slot_uri: sg:contact
    title: contact
    range: Contact
    required: false
    multivalued: true
    description: Contact information (multi-valued).
  contactSingle:
    slot_uri: sg:contact
    title: contact
    range: Contact
    required: true
    multivalued: false
    description: The professional's contact information (exactly one).
  relatedProfessionalRef:
    slot_uri: sg:relatedProfessional
    title: relatedProfessional
    range: Identifier
    required: false
    multivalued: true
    description: References (by Identifier) to Professionals associated with the entity.
  relatedServiceRef:
    slot_uri: sg:relatedService
    title: relatedService
    range: Identifier
    required: false
    multivalued: true
    description: References (by Identifier) to Services associated with the entity.
  relatedOrganisationRef:
    slot_uri: sg:relatedOrganisation
    title: relatedOrganisation
    range: Identifier
    required: false
    multivalued: true
    description: References (by Identifier) to Organisations associated with the entity.

  # --- Organisation / Service typing & service-specific ---
  organisationType:
    slot_uri: sg:organisationType
    title: type
    range: OrganisationCode
    required: true
    multivalued: true
    description: Code(s) for the kind of organisation.
  serviceType:
    slot_uri: sg:serviceType
    title: type
    range: ServiceCode
    required: true
    multivalued: true
    description: Code(s) for the kind of service.
  costFrequency:
    slot_uri: sg:costFrequency
    range: ServiceCostFrequency
    required: true
    multivalued: false
    description: The frequency at which the unit cost occurs.
  delivery:
    slot_uri: sg:delivery
    range: ServiceDelivery
    required: false
    multivalued: true
    description: The way the service is delivered.

  # --- Professional ---
  role:
    slot_uri: sg:role
    range: string
    required: true
    multivalued: true
    description: Text describing the professional's occupational role.
  status:
    slot_uri: sg:status
    range: boolean
    required: false
    multivalued: false
    description: The professional's current working status.

  # --- ServiceEpisode / LifeEvent ---
  episodeType:
    slot_uri: sg:episodeType
    title: type
    range: EpisodeCode
    required: true
    multivalued: true
    description: Code(s) for the type of service episode.
  eventType:
    slot_uri: sg:eventType
    title: type
    range: EventCode
    required: true
    multivalued: true
    description: Code(s) for the type of life event.
  subjectPerson:
    slot_uri: sg:subjectPerson
    range: SubjectPerson
    required: true
    multivalued: true
    description: References to the Person(s) the episode or life event concerns.
  relatedProfessionalObj:
    slot_uri: sg:relatedProfessional
    title: relatedProfessional
    range: RelatedProfessional
    required: false
    multivalued: true
    description: References to the Professional(s) involved, qualified by involvement.
  timeInformation:
    slot_uri: sg:timeInformation
    range: TimeInformation
    required: false
    multivalued: true
    description: Details about the timing of the episode or life event.
  location:
    slot_uri: sg:location
    range: string
    required: false
    multivalued: true
    description: Details about the location of the episode or life event.
  finding:
    slot_uri: sg:finding
    range: Finding
    required: false
    multivalued: true
    description: Observations or measurements made during the course of the episode.
  outcome:
    slot_uri: sg:outcome
    range: EpisodeOutcome
    required: false
    multivalued: false
    description: Outcome of the episode for the subject.

  # --- SubjectPerson / RelatedProfessional ---
  person:
    slot_uri: sg:person
    range: Identifier
    required: true
    multivalued: false
    description: A reference (by Identifier) to a Person record involved in the episode or life event.
  professional:
    slot_uri: sg:professional
    range: Identifier
    required: true
    multivalued: false
    description: A reference (by Identifier) to a Professional record involved in the episode or life event.
  involvement:
    slot_uri: sg:involvement
    range: string
    required: true
    multivalued: false
    description: >-
      Code for the nature of the involvement. Uses an [HL7 v3 ParticipationType
      code](https://terminology.hl7.org/5.2.0/CodeSystem-v3-ParticipationType.html) directly (e.g. SBJ, PPRF); not defined by this standard, so modelled
      as an open string.

  # --- TimeInformation ---
  startDateTime:
    slot_uri: sg:startDateTime
    range: datetime
    required: true
    multivalued: false
    description: The start of the episode or life event, as an ISO 8601 date-time.
  endDateTime:
    slot_uri: sg:endDateTime
    range: datetime
    required: false
    multivalued: false
    description: The end of the episode or life event, as an ISO 8601 date-time.
  frequency:
    slot_uri: sg:frequency
    range: Any
    required: false
    multivalued: false
    inlined: true
    description: >-
      The frequency of the episode or life event, expressed as a
      [FHIR Timing](https://build.fhir.org/datatypes.html#Timing) datatype. This
      standard does not define or validate its structure; the value is an
      arbitrary JSON object conforming to FHIR Timing.

  # --- Finding / Observation / Measurement ---
  observation:
    slot_uri: sg:observation
    range: Observation
    required: false
    multivalued: true
    description: Qualitative observation(s) about the subject or their circumstances.
  measurement:
    slot_uri: sg:measurement
    range: Measurement
    required: false
    multivalued: true
    description: Quantitative measurement(s) about the subject or their circumstances.
  text:
    slot_uri: sg:text
    range: string
    required: false
    multivalued: true
    description: A finding that cannot be represented as an Observation or Measurement.
  observationType:
    slot_uri: sg:observationType
    title: type
    range: string
    required: true
    multivalued: false
    description: >-
      The type of observation, drawn from the Observation Type Vocabulary (e.g.
      NEET, free-school-meals, SEND.SpLD). The vocabulary is extensible (some
      codes carry dynamic sub-parts such as EAL.<ISO 639-1 code>), so it is
      modelled as an open string rather than a closed enumeration. See the
      ObservationType enum for the reference list of codes.
  observationStartDate:
    slot_uri: sg:startDate
    title: startDate
    range: datetime
    required: true
    multivalued: false
    description: The date at which this observation was first true, as an ISO 8601 date-time.
  observationEndDate:
    slot_uri: sg:endDate
    title: endDate
    range: datetime
    required: false
    multivalued: false
    description: The date at which this observation was made false (if now outdated).
  measurementValue:
    slot_uri: sg:value
    title: value
    range: decimal
    required: true
    multivalued: false
    description: A decimal number representing the value of the measurement.
  measurementUnit:
    slot_uri: sg:unit
    title: unit
    range: MeasurementUnit
    required: true
    multivalued: false
    description: The unit of measurement.
  measurementType:
    slot_uri: sg:measurementType
    title: type
    range: MeasurementType
    required: true
    multivalued: false
    description: The type of measurement.

  # --- Identifier / Name / Address / Contact ---
  # The slots of the shared objects (value, system, familyName, givenName,
  # preferredName, use, line1, line2, city, postcode, UPRN, USRN, contactName,
  # email, telephone) are imported from the Person Standard along with their
  # classes, so they are not redefined here.

# ---------------------------------------------------------------------------
# Enums (controlled vocabularies / SKOS concept schemes)
# ---------------------------------------------------------------------------
enums:

  OrganisationCode:
    enum_uri: sg:organisation-code
    title: Organisation Code
    description: Codes to indicate the type of organisation.
    permissible_values:
      local-authority:
        title: Local Authority
        description: Local Authority
        meaning: oc:LocalAuthority
      nhs-trust:
        title: NHS Trust
        description: NHS Trust
        meaning: oc:NhsTrust
      police-force:
        title: Police Force
        description: Police Force
        meaning: oc:PoliceForce

  ServiceCode:
    enum_uri: sg:service-code
    title: Service Code
    description: Codes to indicate the type of service.
    permissible_values:
      youth-offending:
        title: Youth Offending
        description: Youth Offending Team
        meaning: svc:YouthOffending
      primary-school:
        title: Primary School
        description: Primary School
        meaning: svc:PrimarySchool
      high-school:
        title: High School
        description: Secondary or High School
        meaning: svc:HighSchool
      SEN-primary-school:
        title: SEN Primary School
        description: Primary School with specialist SEN services
        meaning: svc:SenPrimarySchool
      SEN-high-school:
        title: SEN High School
        description: Secondary or High School with specialist SEN services
        meaning: svc:SenHighSchool
      alternative-provision-school:
        title: Alternative Provision School
        description: Alternative provision school
        meaning: svc:AlternativeProvisionSchool
      social-care:
        title: Social Care
        description: Social Care Department
        meaning: svc:SocialCare
      family-court:
        title: Family Court
        description: Family Court
        meaning: svc:FamilyCourt
      CAMHS:
        title: CAMHS
        description: Children and Adolescent mental health services
        meaning: svc:Camhs
      reablement:
        title: Reablement
        description: Reablement
        meaning: svc:Reablement
      short-term-nursing-care:
        title: Short Term Nursing Care
        description: Short term nursing care
        meaning: svc:ShortTermNursingCare
      short-term-residential-care:
        title: Short Term Residential Care
        description: Short term residential care
        meaning: svc:ShortTermResidentialCare
      long-term-nursing-care:
        title: Long Term Nursing Care
        description: Long term nursing care
        meaning: svc:LongTermNursingCare
      long-term-residential-care:
        title: Long Term Residential Care
        description: Long term residential care
        meaning: svc:LongTermResidentialCare
      home-support-domiciliary:
        title: Home Support Domiciliary
        description: Home support or domiciliary care
        meaning: svc:HomeSupportDomiciliary
      day-support:
        title: Day Support
        description: Day support
        meaning: svc:DaySupport
      meals:
        title: Meals
        description: Meals
        meaning: svc:Meals
      transport:
        title: Transport
        description: Transport
        meaning: svc:Transport
      equipment:
        title: Equipment
        description: Equipment
        meaning: svc:Equipment
      direct-payment:
        title: Direct Payment
        description: Direct payment
        meaning: svc:DirectPayment
      shared-lives:
        title: Shared Lives
        description: Shared Lives
        meaning: svc:SharedLives
      community-supported-living:
        title: Community Supported Living
        description: Community supported living
        meaning: svc:CommunitySupportedLiving
      extra-care-housing:
        title: Extra Care Housing
        description: Extra care housing
        meaning: svc:ExtraCareHousing
      social-worker-support:
        title: Social Worker Support
        description: "Professional support: Social worker"
        meaning: svc:SocialWorkerSupport
      other-professional-support:
        title: Other Professional Support
        description: "Professional support: Other"
        meaning: svc:OtherProfessionalSupport
      learning-education-employment:
        title: Learning Education Employment
        description: Learning, education or employment support
        meaning: svc:LearningEducationEmployment
      end-of-life-care:
        title: End of Life Care
        description: End of life care
        meaning: svc:EndOfLifeCare
      emergency-support:
        title: Emergency Support
        description: Emergency support
        meaning: svc:EmergencySupport
      other-short-term-support:
        title: Other Short Term Support
        description: Other short term support
        meaning: svc:OtherShortTermSupport
      other-long-term-support:
        title: Other Long Term Support
