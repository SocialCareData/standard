  ObservationType:
    enum_uri: sg:observation-type
    title: Observation Type
    description: Codes to indicate the type of qualitative observation.
    permissible_values:
      SEND:
        title: SEND
        description: Observed special educational needs and disabilities, via DfE codes
        meaning: ot:Send
      "SEND.SpLD":
        title: SEND SpLD
        description: "Specific learning Difficulty: difficulty that affect one or more specific aspects of learning. This encompasses a range of conditions including dyslexia, dyscalculia, dysgraphia, dyspraxia etc."
        meaning: ot:SendSpld
      "SEND.MLD":
        title: SEND MLD
        description: "Moderate Learning Difficulty: well below expected levels of attainment in all or most areas of the curriculum, despite appropriate interventions. They will have much greater difficulty than their peers in acquiring basic literacy and numeracy skills and in understanding concepts. They may also have associated speech and language delay, low self-esteem, low levels of concentration and underdeveloped social skills."
        meaning: ot:SendMld
      "SEND.SLD":
        title: SEND SLD
        description: "Severe Learning Difficulty: significant intellectual or cognitive impairments and are likely to need support in all areas of the curriculum."
        meaning: ot:SendSld
      "SEND.PMLD":
        title: SEND PMLD
        description: "Profound and Multiple Learning Difficulty: have severe and complex learning difficulties as well as a physical disability or sensory impairment."
        meaning: ot:SendPmld
      "SEND.SLCN":
        title: SEND SLCN
        description: "Speech, Language and Communication Needs: difficulty in communicating with others such as difficulty saying what they want to, understanding what is being said to them, difficulties understanding and applying social rules."
        meaning: ot:SendSlcn
      "SEND.ASC":
        title: SEND ASC
        description: "Autistic Spectrum Condition: including Asperger's Syndrome and Autism with associated difficulties such as difficulties with language, communication, imagination and social interactions."
        meaning: ot:SendAsc
      "SEND.SEMH":
        title: SEND SEMH
        description: "Social, Emotional and Mental Health difficulties: These may include becoming withdrawn or isolated, as well as displaying challenging, disruptive or disturbing behaviour. These behaviours may reflect underlying mental health difficulties such as anxiety or depression, self-harming, substance misuse, eating disorders or physical symptoms that are medically unexplained."
        meaning: ot:SendSemh
      "SEND.VI":
        title: SEND VI
        description: "Visual Impairment: Partial or complete loss of sight not correctable by usual means (e.g. prescribed glasses or contact lens)."
        meaning: ot:SendVi
      "SEND.HI":
        title: SEND HI
        description: "Hearing Impairment: With a degree of hearing loss."
        meaning: ot:SendHi
      "SEND.MSI":
        title: SEND MSI
        description: "Multi Sensory Impairment: combined vision and hearing impairments."
        meaning: ot:SendMsi
      "SEND.PD":
        title: SEND PD
        description: "Physical Disability: limitation on a person's physical functioning, mobility, dexterity or stamina."
        meaning: ot:SendPd
      "SEND.DS":
        title: SEND DS
        description: "Down Syndrome: a genetic disorder caused by the presence of all or part of a third copy of chromosome 21."
        meaning: ot:SendDs
      "SEND.OTH":
        title: SEND OTH
        description: "Other SEND: any other special educational need or disability not covered by the other codes."
        meaning: ot:SendOth
      "SEND.NSA":
        title: SEND NSA
        description: "NSA SEN support but no specialist assessment of type of need."
        meaning: ot:SendNsa
