        meaning: svc:OtherCarerSupport

  ServiceCostFrequency:
    enum_uri: sg:service-cost-frequency
    title: Service Cost Frequency
    description: >-
      Codes to indicate the payment schedule a service adheres to. From the
      Adult Social Care Client Level Data specification.
    permissible_values:
      none:
        title: None
        description: No charge to client
        meaning: scf:None
      per-session:
        title: Per Session
        description: Per session
