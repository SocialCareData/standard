        meaning: scf:Fortnightly
      four-weekly:
        title: Four Weekly
        description: 4-weekly
        meaning: scf:FourWeekly
      monthly:
        title: Monthly
        description: Monthly
        meaning: scf:Monthly
      quarterly:
        title: Quarterly
        description: Quarterly
        meaning: scf:Quarterly
      annually:
        title: Annually
        description: Annually
        meaning: scf:Annually
      one-off:
        title: One Off
        description: One-off
        meaning: scf:OneOff

  ServiceDelivery:
    enum_uri: sg:service-delivery
    title: Service Delivery
    description: >-
      Codes to indicate the way a service is delivered. From the Adult Social
