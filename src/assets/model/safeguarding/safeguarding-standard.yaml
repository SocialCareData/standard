      assessment:
        title: Assessment
        description: Progress to assessment, review, or reassessment
        meaning: eo:Assessment
      hospital:
        title: Hospital
        description: Admitted to hospital
        meaning: eo:Hospital
      continuation:
        title: Continuation
        description: Continuation of support or services
        meaning: eo:Continuation
      planning:
        title: Planning
        description: Progress to support or service planning
        meaning: eo:Planning
      NFA-planned:
        title: NFA Planned
